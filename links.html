<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="robots"
        content="noindex, nofollow"
    >

    <title>Alyssa B. Flowered</title>

    <meta
        name="description"
        content="Alyssa B. Flowered · Autrice fantasy"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@400;500&display=swap"
        rel="stylesheet"
    >

    <style>

        :root {
            --background: #08080b;
            --text: #f2eee7;
            --muted: rgba(242, 238, 231, 0.52);
            --border: rgba(242, 238, 231, 0.15);
            --border-hover: rgba(242, 238, 231, 0.35);
            --gold: #beaC8f;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            background: var(--background);
            color: var(--text);
            font-family: "Montserrat", sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            overflow-x: hidden;
        }


        /* =========================
           SFONDO
        ========================= */

        .background-effects {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: -5;

            background:
                radial-gradient(
                    ellipse at 50% 15%,
                    rgba(55, 38, 48, 0.18),
                    transparent 48%
                ),
                radial-gradient(
                    ellipse at 15% 75%,
                    rgba(35, 28, 38, 0.20),
                    transparent 45%
                ),
                radial-gradient(
                    ellipse at 85% 55%,
                    rgba(25, 34, 43, 0.18),
                    transparent 48%
                ),
                #08080b;
        }

        .background-effects::before {
            content: "";
            position: absolute;
            inset: -20%;

            background:
                radial-gradient(
                    ellipse at 30% 20%,
                    rgba(105, 76, 65, 0.07),
                    transparent 35%
                ),
                radial-gradient(
                    ellipse at 70% 80%,
                    rgba(76, 62, 91, 0.06),
                    transparent 40%
                );

            filter: blur(45px);

            animation:
                shadowDrift
                22s
                ease-in-out
                infinite
                alternate;
        }

        @keyframes shadowDrift {
            0% {
                transform:
                    translate(-2%, -1%)
                    scale(1);
            }

            50% {
                transform:
                    translate(2%, 2%)
                    scale(1.04);
            }

            100% {
                transform:
                    translate(-1%, 3%)
                    scale(1.02);
            }
        }


        /* =========================
           FRATTURE
        ========================= */

        .fracture {
            position: absolute;
            width: 1px;
            height: 150%;
            top: -25%;

            background:
                linear-gradient(
                    to bottom,
                    transparent 0%,
                    rgba(190, 172, 143, 0.00) 12%,
                    rgba(190, 172, 143, 0.16) 28%,
                    rgba(190, 172, 143, 0.05) 48%,
                    rgba(190, 172, 143, 0.12) 67%,
                    rgba(190, 172, 143, 0.00) 88%,
                    transparent 100%
                );

            opacity: 0.45;
            transform-origin: center;
            filter: blur(0.15px);
        }

        .fracture-1 {
            left: 19%;
            transform:
                rotate(12deg)
                skewX(-8deg);
        }

        .fracture-2 {
            left: 43%;
            height: 125%;
            opacity: 0.25;

            transform:
                rotate(-7deg)
                skewX(5deg);
        }

        .fracture-3 {
            left: 67%;
            height: 140%;
            opacity: 0.32;

            transform:
                rotate(9deg)
                skewX(-4deg);
        }

        .fracture-4 {
            left: 82%;
            height: 115%;
            opacity: 0.20;

            transform:
                rotate(-14deg)
                skewX(7deg);
        }

        .fracture::before {
            content: "";
            position: absolute;
            width: 1px;
            height: 42%;
            top: 17%;
            left: 0;

            background: inherit;

            transform:
                rotate(28deg)
                translateX(15px);
        }

        .fracture::after {
            content: "";
            position: absolute;
            width: 1px;
            height: 34%;
            top: 51%;
            left: 0;

            background: inherit;

            transform:
                rotate(-24deg)
                translateX(-12px);
        }


        /* =========================
           PARTICELLE
        ========================= */

        .dark-particle {
            position: absolute;
            width: 2px;
            height: 2px;

            border-radius: 50%;

            background:
                rgba(190, 174, 151, 0.28);

            opacity: 0.18;

            animation:
                particleFloat
                14s
                ease-in-out
                infinite
                alternate;
        }

        .particle-1 {
            top: 18%;
            left: 14%;
        }

        .particle-2 {
            top: 34%;
            left: 72%;
            width: 1px;
            height: 1px;
            animation-delay: -5s;
        }

        .particle-3 {
            top: 56%;
            left: 28%;
            width: 3px;
            height: 3px;
            animation-delay: -8s;
        }

        .particle-4 {
            top: 71%;
            left: 84%;
            width: 1px;
            height: 1px;
            animation-delay: -3s;
        }

        .particle-5 {
            top: 87%;
            left: 47%;
            width: 2px;
            height: 2px;
            animation-delay: -10s;
        }

        @keyframes particleFloat {

            0% {
                transform:
                    translate(0, 0);
                opacity: 0.08;
            }

            50% {
                opacity: 0.24;
            }

            100% {
                transform:
                    translate(12px, -18px);
                opacity: 0.12;
            }
        }


        /* =========================
           PAGINA
        ========================= */

        .page {
            width: 100%;
            max-width: 520px;

            min-height: 100vh;

            display: flex;
            flex-direction: column;
            align-items: center;

            padding:
                90px
                24px
                45px;
        }


        /* =========================
           IDENTITÀ
        ========================= */

        .identity {
            text-align: center;
            margin-bottom: 48px;
        }

        .name {
            margin: 0;

            font-family:
                "Cormorant Garamond",
                serif;

            font-size: 38px;
            font-weight: 500;

            letter-spacing: 0.08em;
            line-height: 1.1;

            color: var(--text);
        }

        .role {
            margin-top: 12px;

            font-size: 9px;
            letter-spacing: 0.28em;
            text-transform: uppercase;

            color: var(--muted);
        }


        /* =========================
           LINK
        ========================= */

        .links {
            width: 100%;

            display: flex;
            flex-direction: column;

            gap: 14px;
        }

        .link-button {
            position: relative;

            width: 100%;
            min-height: 58px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding:
                15px
                24px;

            border:
                1px solid
                var(--border);

            background:
                rgba(8, 8, 11, 0.34);

            color: var(--text);

            text-decoration: none;

            font-size: 10px;
            letter-spacing: 0.19em;
            text-transform: uppercase;

            transition:
                border-color 0.3s ease,
                background 0.3s ease,
                transform 0.3s ease;
        }

        .link-button:hover {
            border-color:
                var(--border-hover);

            background:
                rgba(242, 238, 231, 0.035);

            transform:
                translateY(-2px);
        }


        /* =========================
           LINK LIBRO
        ========================= */

        .book-button {
            flex-direction: column;
            gap: 5px;

            cursor: default;
        }

        .book-button:hover {
            transform: none;

            border-color:
                var(--border);

            background:
                rgba(8, 8, 11, 0.34);
        }

        .book-title {
            font-size: 10px;
            letter-spacing: 0.19em;
        }

        .book-status {
            font-size: 7px;
            letter-spacing: 0.18em;

            color:
                rgba(242, 238, 231, 0.40);
        }


        /* =========================
           FOOTER
        ========================= */

        .footer {
            margin-top: auto;
            padding-top: 65px;

            font-size: 8px;
            letter-spacing: 0.24em;

            color:
                rgba(242, 238, 231, 0.25);

            text-transform: uppercase;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 500px) {

            .page {
                padding:
                    78px
                    20px
                    35px;
            }

            .name {
                font-size: 31px;
                letter-spacing: 0.07em;
            }

            .identity {
                margin-bottom: 40px;
            }

            .link-button {
                min-height: 56px;
            }
        }

    </style>
</head>


<body>

    <div
        class="background-effects"
        aria-hidden="true"
    >

        <div class="fracture fracture-1"></div>
        <div class="fracture fracture-2"></div>
        <div class="fracture fracture-3"></div>
        <div class="fracture fracture-4"></div>

        <div class="dark-particle particle-1"></div>
        <div class="dark-particle particle-2"></div>
        <div class="dark-particle particle-3"></div>
        <div class="dark-particle particle-4"></div>
        <div class="dark-particle particle-5"></div>

    </div>


    <main class="page">

        <header class="identity">

            <h1 class="name">
                Alyssa B. Flowered
            </h1>

            <div class="role">
                Autrice fantasy
            </div>

        </header>


        <nav
            class="links"
            aria-label="Link principali"
        >

            <a
                class="link-button"
                href="https://alysscriptum.github.io/alysscriptum/"
            >
                Sito ufficiale
            </a>


            <div
                class="link-button book-button"
                aria-disabled="true"
            >

                <span class="book-title">
                    La Chiave delle Ombre
                </span>

                <span class="book-status">
                    Presto disponibile
                </span>

            </div>

        </nav>


        <footer class="footer">
            Alysscriptum
        </footer>

    </main>

</body>
</html>
